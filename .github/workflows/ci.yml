name: CI

# The checks the README lists, on the same toolchain the app is deployed with:
#
#   bun install --frozen-lockfile → lint → tsc --noEmit → vitest run
#                                 → next build (static export to dist/)
#
# Bun rather than npm on purpose: the hosting install command is `bun install`
# and the build command is `bun run build`, so CI validates what actually ships.
# (`package-lock.json` is the older lockfile and is not complete enough for a
# strict `npm ci` on recent npm — `bun.lock` is the source of truth.)
#
# No secrets are needed: without the Supabase keys the app builds in demo mode.

# Every branch, not just main: this repository has more than one line of work in
# flight, and a branch should be checkable before anyone has to review it.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7 runs on Node 24; the v4 pins were being forced onto a newer runtime
      # and warned about it on every run.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build (static export to dist/)
        run: bun run build
