name: CI

# The same checks the README lists, run on every push and pull request, so a
# broken report form cannot land on `main` unnoticed.
#
#   npm ci → lint → tsc --noEmit → vitest run → next build (static export)
#
# Install uses npm and the tracked `package-lock.json`; the build needs no
# secrets — without the Supabase keys the app builds in demo mode.

# Every branch, not just main: this repository has more than one line of work in
# flight, and a branch should be checkable before anyone has to review it.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7 of both actions runs on Node 24; the v4 pins were being forced onto
      # a newer runtime and warned about it on every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build (static export to dist/)
        run: npm run build
